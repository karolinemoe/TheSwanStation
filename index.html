<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Swan — Station 3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <section class="clock-wrap">
      <div class="clock" id="clock" aria-live="off">
        <div class="window">
          <div class="digit black" data-idx="0"></div>
          <div class="digit black" data-idx="1"></div>
          <div class="digit black" data-idx="2"></div>
        </div>
        <div class="window">
          <div class="digit white" data-idx="3"></div>
          <div class="digit white" data-idx="4"></div>
        </div>
      </div>
    </section>

    <section class="terminal" id="terminal">
      <div class="screen">
        <div id="log"></div>
        <div class="line input-line"><span class="prompt">&gt;:</span><span id="typed"></span><span class="cursor">&#9608;</span></div>
      </div>
      <div class="scanlines"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
